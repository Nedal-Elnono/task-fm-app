name: Windows Build

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Windows installer (NSIS)
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > win.override.json
          npm run tauri build -- --bundles nsis --config win.override.json

      - uses: actions/upload-artifact@v4
        with:
          name: TASK-FM-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
