[package]
name = "taskfm"
version = "0.2.1"
description = "TASK FM - Lightweight Desktop Checklist"
authors = ["taskfm"]
edition = "2021"

[lib]
name = "taskfm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Mac App Store build: `tauri build --features mas` — skips registering the
# self-updater (Apple guideline 2.4.5(vii) forbids self-updating apps).
mas = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
